[project]
name = "svribe"
version = "0.1.0"
description = "Svribe is your personal Discord Assistant that will transform a server into your small auto-organized notespace."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "discord-py>=2.7.1",
    "google-genai>=2.7.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "tldextract>=5.3.1",
]
